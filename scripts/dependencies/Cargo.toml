[package]
name = "dependencies-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "dependencies"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
